# Experiment settings. Code reads these values; nothing below is hard-coded elsewhere.
# To try another region or period, copy this file and pass it with --config.

[region]
name = "thailand"
lat_min = 5.0
lat_max = 21.0
lon_min = 97.0
lon_max = 106.0

# Smaller areas scored separately at evaluation (models still train on the whole region).
[eval_regions.bangkok]
name = "bangkok"
lat_min = 13.5
lat_max = 14.0
lon_min = 100.3
lon_max = 100.9

[period]
train_years = [2022, 2023]
val_years = [2024]
test_years = [2025]
months = [5, 6, 7, 8, 9, 10]  # May-Oct monsoon season

[era5]
single_level_vars = ["total_precipitation", "total_column_water_vapour"]
pressure_level_vars = ["u_component_of_wind", "v_component_of_wind"]
pressure_level = 850
resolution_deg = 0.25

[chirps]
resolution_deg = 0.05

[paths]
raw = "data/raw"
interim = "data/interim"
processed = "data/processed"
figures = "figures"
checkpoints = "checkpoints"
