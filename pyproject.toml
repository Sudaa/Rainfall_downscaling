[project]
name = "rainfall-downscaling-baseline"
version = "0.1.0"
description = "Baseline statistical downscaling of daily rainfall from ERA5 (0.25 deg) to CHIRPS (0.05 deg) over Thailand"
readme = "README.md"
authors = [
    { name = "SUDARSHAN", email = "tamangsudarshan213@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cdsapi>=0.7.7",
    "ecmwf-datastores-client>=0.5.3",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "xarray>=2026.9.0",
]

[project.scripts]
rainfall = "rainfall_downscaling_baseline.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
